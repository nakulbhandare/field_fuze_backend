services:
  fieldfuze-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldfuze-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8081
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE_PREFIX=dev
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"