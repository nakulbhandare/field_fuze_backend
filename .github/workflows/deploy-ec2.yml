name: Deploy FieldFuze to AWS EC2 (ECR-based)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.2'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check go formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  build_and_push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "🚀 Building Docker image..."
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "✅ Image pushed to ECR: $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    name: Deploy on EC2 from ECR
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy on EC2
        run: |
          IMAGE_TAG=${{ needs.build_and_push.outputs.image_tag || github.sha }}
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "🔄 Logging into ECR..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            echo "🛑 Stopping old containers..."
            docker-compose down || true

            echo "🧹 Cleaning up old images..."
            docker image prune -f || true

            echo "🚀 Pulling latest image from ECR..."
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}

            echo "⚙️ Updating docker-compose.yml with new image..."
            sed -i "s|image: .*|image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}|" ~/deployment/docker-compose.yml

            echo "🧱 Starting new containers..."
            docker-compose up -d

            echo "⏳ Waiting for app startup..."
            sleep 20

            echo "🔍 Health check..."
            if curl -fsS http://localhost:8081/api/v1/auth/health; then
              echo "✅ App running successfully!"
            else
              echo "❌ App failed to start"
              docker-compose logs
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f private_key.pem

      - name: Deployment Summary
        run: |
          echo "🎉 FieldFuze deployed successfully via ECR!"
          echo "🌐 API: http://${{ secrets.EC2_HOST }}:8081"
          echo "📖 Swagger: http://${{ secrets.EC2_HOST }}:8081/swagger"
