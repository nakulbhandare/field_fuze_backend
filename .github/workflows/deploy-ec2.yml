name: Deploy FieldFuze to AWS EC2 (ECR-based)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.2'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check go formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  build_and_push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push Image to ECR
        id: meta
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "🚀 Building multi-arch Docker image using root Dockerfile..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            .
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Multi-arch image pushed to ECR: $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    name: Deploy on EC2 from ECR
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy on EC2
        env:
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          echo "Using IMAGE_TAG=$IMAGE_TAG"
          echo "Using ECR_REGISTRY=$ECR_REGISTRY"
          echo "Using IMAGE_NAME=$IMAGE_NAME"
          
          # Create deployment script
          cat > deploy_script.sh << 'EOF'
          set -e
          
          echo "🔄 Logging into ECR..."
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          echo "🛑 Stopping old containers..."
          mkdir -p ~/fieldfuze-app
          cd ~/fieldfuze-app
          docker-compose down || true
          
          echo "🧹 Cleaning up old images..."
          docker image prune -f || true
          
          echo "🚀 Pulling latest image from ECR..."
          docker pull $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          
          echo "⚙️ Creating docker-compose.yml with ECR image..."
          cat > docker-compose.yml << 'COMPOSE_EOF'
          version: '3.8'
          
          services:
            fieldfuze-backend:
              image: $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
              container_name: fieldfuze-backend
              ports:
                - "8081:8081"
              environment:
                - APP_ENV=production
                - APP_HOST=0.0.0.0
                - APP_PORT=8081
                - AWS_REGION=${AWS_REGION:-us-east-1}
                - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
                - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
                - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
                - DYNAMODB_TABLE_PREFIX=${DYNAMODB_TABLE_PREFIX:-prod}
                - LOG_LEVEL=${LOG_LEVEL:-info}
                - LOG_FORMAT=${LOG_FORMAT:-json}
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/auth/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
              logging:
                driver: "json-file"
                options:
                  max-size: "10m"
                  max-file: "3"
          COMPOSE_EOF
          
          echo "🧱 Starting new containers..."
          docker-compose up -d
          
          echo "⏳ Waiting for app startup..."
          sleep 20
          
          echo "🔍 Checking application health..."
          if curl -fsS http://localhost:8081/api/v1/auth/health; then
            echo "✅ App running successfully!"
          else
            echo "❌ App failed to start"
            docker-compose logs
            exit 1
          fi
          EOF
          
          # Copy and execute script on EC2
          scp -o StrictHostKeyChecking=no -i private_key.pem deploy_script.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "chmod +x ~/deploy_script.sh && ECR_REGISTRY='$ECR_REGISTRY' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' ~/deploy_script.sh"

      - name: Cleanup
        if: always()
        run: rm -f private_key.pem

      - name: Deployment Summary
        run: |
          echo "🎉 FieldFuze deployed successfully!"
          echo "🌐 API: http://${{ secrets.EC2_HOST }}:8081"
          echo "📖 Swagger: http://${{ secrets.EC2_HOST }}:8081/swagger"

          