name: Deploy FieldFuze to AWS EC2

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.2'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Check go formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          exit 1
        fi

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create environment file
      run: |
        cat > deployment/.env << EOF
        AWS_REGION=${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        DYNAMODB_TABLE_PREFIX=prod
        LOG_LEVEL=info
        LOG_FORMAT=json
        EOF

    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
        chmod 600 private_key.pem

    - name: Copy files to EC2
      run: |
        scp -o StrictHostKeyChecking=no -i private_key.pem -r deployment/ \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/

    - name: Deploy on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i private_key.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          
          # Navigate to deployment directory
          cd ~/deployment
          
          # Stop existing containers
          docker-compose down || true
          
          # Remove old images to save space
          docker image prune -f || true
          
          # Build and start the application
          docker-compose up -d --build
          
          # Wait for application to start
          sleep 30
          
          # Check if application is running
          if curl -f http://localhost:8081/api/v1/auth/health; then
            echo "✅ Application is running successfully"
            echo "🌐 API: http://${{ secrets.EC2_HOST }}:8081"
            echo "📖 Swagger: http://${{ secrets.EC2_HOST }}:8081/swagger"
          else
            echo "❌ Application failed to start"
            docker-compose logs
            exit 1
          fi
        EOF

    - name: Cleanup SSH key
      if: always()
      run: rm -f private_key.pem

    - name: Deployment Summary
      run: |
        echo "🎉 FieldFuze deployment completed!"
        echo ""
        echo "📋 Access URLs:"
        echo "  - API Health: http://${{ secrets.EC2_HOST }}:8081/api/v1/auth/health"
        echo "  - Swagger UI: http://${{ secrets.EC2_HOST }}:8081/swagger"
        echo "  - Main API: http://${{ secrets.EC2_HOST }}:8081/api/v1/auth"